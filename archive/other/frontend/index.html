<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawn IFD Trader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        select, input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .decision {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        
        .decision.GO {
            background: #4caf50;
            color: white;
        }
        
        .decision.HOLD {
            background: #ff9800;
            color: white;
        }
        
        .decision.NG {
            background: #f44336;
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .direction {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .direction.buy {
            background: #4caf50;
            color: white;
        }
        
        .direction.sell {
            background: #f44336;
            color: white;
        }
        
        .direction.stay {
            background: #9e9e9e;
            color: white;
        }
        
        .stars {
            font-size: 30px;
            color: #ffc107;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .loader.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dawn IFD Trader</h1>
            <p>GMOハイブリッドIFD計算システム</p>
        </div>
        
        <div class="card">
            <h2>分析設定</h2>
            
            <div class="input-group">
                <label for="symbol">銘柄</label>
                <select id="symbol">
                    <option value="JP225">日本225 (JP225)</option>
                    <option value="NAS100">米国NQ100ミニ (NAS100)</option>
                    <option value="GER40">ドイツ40 (GER40)</option>
                    <option value="XAUUSD">金スポット (XAUUSD)</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="timeframe">時間足</label>
                <select id="timeframe">
                    <option value="30m">30分足</option>
                    <option value="1h">1時間足</option>
                    <option value="4h">4時間足</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="csvFile">CSVファイル (time, open, high, low, close, volume)</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            
            <div class="input-group">
                <label for="sentimentPos">ポジティブ感情 (%)</label>
                <input type="number" id="sentimentPos" min="0" max="100" value="50">
            </div>
            
            <div class="input-group">
                <label for="sentimentNeg">ネガティブ感情 (%)</label>
                <input type="number" id="sentimentNeg" min="0" max="100" value="20">
            </div>
            
            <button class="btn" id="analyzeBtn" onclick="analyzeIFD()">分析実行</button>
        </div>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>分析中...</p>
        </div>
        
        <div class="result" id="result">
            <div class="card">
                <h2>判定結果</h2>
                <div class="decision" id="decision"></div>
                
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-label">方向</div>
                        <div class="stat-value" id="direction"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Entry</div>
                        <div class="stat-value" id="entry"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">TP1</div>
                        <div class="stat-value" id="tp1"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">TP2</div>
                        <div class="stat-value" id="tp2"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">SL</div>
                        <div class="stat-value" id="sl"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">AIスコア</div>
                        <div class="stat-value" id="aiScore"></div>
                    </div>
                </div>
                
                <div class="stat">
                    <div class="stat-label">推奨度</div>
                    <div class="stars" id="stars"></div>
                </div>
            </div>
            
            <div class="card">
                <h3>テクニカル指標</h3>
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-label">RSI</div>
                        <div class="stat-value" id="rsi"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">SMA25</div>
                        <div class="stat-value" id="sma25"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">SMA75</div>
                        <div class="stat-value" id="sma75"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">MACD</div>
                        <div class="stat-value" id="macd"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Signal</div>
                        <div class="stat-value" id="signal"></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">ATR</div>
                        <div class="stat-value" id="atr"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function analyzeIFD() {
            const symbol = document.getElementById('symbol').value;
            const timeframe = document.getElementById('timeframe').value;
            const csvFile = document.getElementById('csvFile').files[0];
            const sentimentPos = document.getElementById('sentimentPos').value;
            const sentimentNeg = document.getElementById('sentimentNeg').value;
            
            if (!csvFile) {
                alert('CSVファイルを選択してください');
                return;
            }
            
            // UIの更新
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('loader').classList.add('show');
            document.getElementById('result').classList.remove('show');
            
            // FormDataの作成
            const formData = new FormData();
            formData.append('csv_file', csvFile);
            formData.append('symbol', symbol);
            formData.append('timeframe', timeframe);
            formData.append('sentiment_pos', sentimentPos);
            formData.append('sentiment_neg', sentimentNeg);
            
            try {
                // APIリクエスト
                const response = await fetch('http://localhost:8000/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('分析に失敗しました');
                }
                
                const data = await response.json();
                
                // 結果の表示
                displayResult(data);
                
            } catch (error) {
                alert('エラー: ' + error.message);
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('loader').classList.remove('show');
            }
        }
        
        function displayResult(data) {
            // 判定結果
            const decisionEl = document.getElementById('decision');
            decisionEl.textContent = data.decision;
            decisionEl.className = 'decision ' + data.decision;
            
            // 方向
            const directionEl = document.getElementById('direction');
            directionEl.innerHTML = `<span class="direction ${data.direction}">${data.direction.toUpperCase()}</span>`;
            
            // 価格
            document.getElementById('entry').textContent = data.entry_price.toFixed(2);
            document.getElementById('tp1').textContent = data.take_profit_1.toFixed(2);
            document.getElementById('tp2').textContent = data.take_profit_2.toFixed(2);
            document.getElementById('sl').textContent = data.stop_loss.toFixed(2);
            document.getElementById('aiScore').textContent = (data.ai_score * 100).toFixed(1) + '%';
            document.getElementById('stars').textContent = data.stars;
            
            // テクニカル
            const tech = data.technicals;
            document.getElementById('rsi').textContent = tech.rsi.toFixed(1);
            document.getElementById('sma25').textContent = tech.sma25.toFixed(2);
            document.getElementById('sma75').textContent = tech.sma75.toFixed(2);
            document.getElementById('macd').textContent = tech.macd.toFixed(2);
            document.getElementById('signal').textContent = tech.signal.toFixed(2);
            document.getElementById('atr').textContent = tech.atr ? tech.atr.toFixed(2) : 'N/A';
            
            // 結果を表示
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
