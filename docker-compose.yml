version: '3.8'

services:
  fastapi:
    build: .
    container_name: cfd3-fastapi
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GMAIL_TO=${GMAIL_TO}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - cfd3-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: cfd3-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi:8080
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - cfd3-network

  nginx:
    image: nginx:alpine
    container_name: cfd3-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - fastapi
      - streamlit
    restart: unless-stopped
    networks:
      - cfd3-network

networks:
  cfd3-network:
    driver: bridge
