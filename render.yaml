services:
  - type: web
    name: cfd3-trade-system
    env: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      uvicorn webhook_server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: "10000"
