<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>🧠 CFD3 AI Trade System Ver.109</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 30px;
    }
    h1 { color: cyan; }
    button {
      background-color: cyan;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #result, #result_ai {
      background: #222;
      color: #0f0;
      text-align: left;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>🧠 CFD3 AI Trade System Ver.109</h1>

  <h2>📸 手動IFD（スクショ）</h2>
  <form id="uploadForm">
    <input type="file" id="fileInput" name="file" />
    <button type="submit">送信して解析</button>
  </form>
  <div id="result">結果はここに表示されます</div>

  <h2>🤖 AIスイングIFD（4銘柄）</h2>
  <button id="runAI">AIスイング解析を実行</button>
  <div id="result_ai">結果はここに表示されます</div>

  <script>
    // 手動IFD
    const form = document.getElementById("uploadForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) {
        alert("⚠ ファイルが選択されていません");
        return;
      }
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch("/analyze/image", { method: "POST", body: formData });
      const data = await res.json();
      document.getElementById("result").innerText = JSON.stringify(data, null, 2);
    });

    // AIスイング
    document.getElementById("runAI").addEventListener("click", async () => {
      const res = await fetch("/analyze/swing_multi", { method: "POST" });
      const data = await res.json();
      document.getElementById("result_ai").innerText = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
