<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🧠 CFD3 AI Trade System Ver.113</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body { 
  background:#111; 
  color:#0f0; 
  font-family:monospace; 
  text-align:center;
  margin: 20px;
}
h1 { 
  color:#00d4ff; 
  text-shadow: 0 0 10px #00d4ff;
}
h2 {
  color: #00ff88;
  margin-top: 30px;
  text-align: left;
  padding-left: 5%;
}
button { 
  background:#00d4ff; 
  border:none; 
  color:#000; 
  padding:10px 24px; 
  border-radius:8px; 
  cursor:pointer; 
  font-weight:bold;
  margin: 8px;
  font-size: 14px;
}
button:hover {
  background:#00b4ff;
  transform: scale(1.05);
}
#spinner { 
  display:none; 
  margin:15px;
  font-size: 18px;
  color: #00d4ff;
}
.result { 
  text-align:left; 
  background:#000; 
  color:#0f0; 
  padding:15px; 
  margin:10px auto; 
  width:90%; 
  border-radius:10px;
  border: 2px solid #00d4ff;
  min-height: 80px;
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  margin: 10px auto;
  width: 100%;
  background: #1a1a1a;
}
th, td {
  border: 1px solid #00d4ff;
  padding: 8px 12px;
  text-align: left;
}
th {
  background-color: #004050;
  color: #00ffff;
}
td {
  color: #00ff00;
}
h3 {
  color: #00d4ff;
  margin-top: 20px;
}
hr {
  border: 1px solid #00d4ff;
  margin: 25px 0;
}
.section-divider {
  margin: 40px 0;
  border-top: 3px solid #00d4ff;
}
</style>
</head>
<body>
<h1>🧠 CFD3 AI Trade System Ver.113</h1>
<p style="color:#00d4ff;">💹 スイング + デイトレ同時解析 | 🧠 AI判定 | 📰 ニュース感情反映</p>

<div style="margin: 20px;">
  <button onclick="runSwing()">📊 AIスイング解析（4時間足）</button>
  <button onclick="runDay()">⚡ デイトレIFDOCO解析（30分足）</button>
  <button onclick="runAll()">🚀 両方同時実行</button>
</div>

<div id="spinner">🔄 解析中...</div>

<h2>📊 スイング分析結果（4時間足）</h2>
<div id="swingResult" class="result">結果はここに表示されます</div>

<div class="section-divider"></div>

<h2>⚡ デイトレ（IFDOCO）分析結果（30分足）</h2>
<div id="dayResult" class="result">結果はここに表示されます</div>

<script>
async function runSwing() {
  document.getElementById("spinner").style.display = "block";
  document.getElementById("swingResult").innerHTML = "解析中...";
  
  try {
    const res = await fetch("/analyze/swing");
    const data = await res.json();
    document.getElementById("spinner").style.display = "none";
    
    let output = "";
    if (data.results && data.results.length > 0) {
      data.results.forEach(r => output += (r.markdown || "") + "\n---\n");
      document.getElementById("swingResult").innerHTML = marked.parse(output);
    } else {
      document.getElementById("swingResult").innerHTML = "⚠️ 結果が取得できませんでした";
    }
  } catch (error) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("swingResult").innerHTML = "❌ エラー: " + error.message;
  }
}

async function runDay() {
  document.getElementById("spinner").style.display = "block";
  document.getElementById("dayResult").innerHTML = "解析中...";
  
  try {
    const res = await fetch("/analyze/day");
    const data = await res.json();
    document.getElementById("spinner").style.display = "none";
    
    let output = "";
    if (data.results && data.results.length > 0) {
      data.results.forEach(r => output += (r.markdown || "") + "\n---\n");
      document.getElementById("dayResult").innerHTML = marked.parse(output);
    } else {
      document.getElementById("dayResult").innerHTML = "⚠️ 結果が取得できませんでした";
    }
  } catch (error) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("dayResult").innerHTML = "❌ エラー: " + error.message;
  }
}

async function runAll() {
  document.getElementById("spinner").style.display = "block";
  document.getElementById("swingResult").innerHTML = "解析中...";
  document.getElementById("dayResult").innerHTML = "解析中...";
  
  try {
    const [swingRes, dayRes] = await Promise.all([
      fetch("/analyze/swing"),
      fetch("/analyze/day")
    ]);
    
    const swingData = await swingRes.json();
    const dayData = await dayRes.json();
    
    document.getElementById("spinner").style.display = "none";
    
    // Swing results
    let swingOutput = "";
    if (swingData.results && swingData.results.length > 0) {
      swingData.results.forEach(r => swingOutput += (r.markdown || "") + "\n---\n");
      document.getElementById("swingResult").innerHTML = marked.parse(swingOutput);
    }
    
    // Day results
    let dayOutput = "";
    if (dayData.results && dayData.results.length > 0) {
      dayData.results.forEach(r => dayOutput += (r.markdown || "") + "\n---\n");
      document.getElementById("dayResult").innerHTML = marked.parse(dayOutput);
    }
  } catch (error) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("swingResult").innerHTML = "❌ エラー: " + error.message;
    document.getElementById("dayResult").innerHTML = "❌ エラー: " + error.message;
  }
}
</script>
</body>
</html>
