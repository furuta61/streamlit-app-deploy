<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>韓国語文法 学習</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    select, button { font-size: 16px; padding: 4px 8px; }
    pre { white-space: pre-wrap; background: #f7f7f7; padding: 16px; }
  </style>
</head>
<body>

<h1>韓国語文法</h1>

<label>課を選択：</label>
<select id="unit">
  <option value="18">文法18</option>
  <option value="19">文法19</option>
  <option value="20">文法20</option>
  <option value="21">文法21</option>
  <option value="22">文法22</option>
  <option value="23">文法23</option>
  <option value="24">文法24</option>
  <option value="25">文法25</option>
</select>

<button onclick="loadGrammar()">解説を見る</button>

<hr>

<h2>解説</h2>
<pre id="content">課を選んでください。</pre>

<script>
async function loadGrammar() {
  const unit = document.getElementById("unit").value;
  const res = await fetch(`/api/grammar/${unit}`);
  if (!res.ok) {
    document.getElementById("content").textContent = "読み込みエラー";
    return;
  }
  const data = await res.json();
  document.getElementById("content").textContent = data.content;
}
</script>

</body>
</html>
