<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 CFD3 AI Trade System v108</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #121212;
      color: #eee;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
    }
    .btn {
      border-radius: 10px;
      font-weight: 600;
    }
    .section-title {
      font-size: 1.3rem;
      border-left: 5px solid #007bff;
      padding-left: 12px;
      margin-bottom: 20px;
      color: #4fc3f7;
    }
    .result-box {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      max-height: 600px;
      overflow-y: auto;
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .nav-tabs .nav-link {
      color: #bbb;
      background: #2a2a2a;
      border: none;
      border-radius: 8px 8px 0 0;
      margin-right: 5px;
    }
    .nav-tabs .nav-link.active {
      color: #fff;
      background: #007bff;
    }
    .tab-content {
      background: #2a2a2a;
      border-radius: 0 10px 10px 10px;
      padding: 25px;
    }
    .health-status {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #2a2a2a;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 2px solid #28a745;
      color: #28a745;
    }
    .health-status.offline {
      border-color: #dc3545;
      color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="health-status" id="healthStatus">● オフライン</div>

  <div class="container">
    <h1 class="text-center mb-4">🧠 CFD3 AI Trade System <span style="color:#4fc3f7;">Ver.108</span></h1>
    <p class="text-center text-muted mb-4">AIスイング + 手動IFD + TradingView Webhook統合版</p>

    <!-- タブナビゲーション -->
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="manual-tab" data-bs-toggle="tab" data-bs-target="#manual" type="button">
          📸 手動IFD（スクショ）
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="ai-tab" data-bs-toggle="tab" data-bs-target="#ai" type="button">
          🤖 AIスイングIFD
        </button>
      </li>
    </ul>

    <!-- タブコンテンツ -->
    <div class="tab-content" id="mainTabContent">
      <!-- 手動IFDタブ -->
      <div class="tab-pane fade show active" id="manual" role="tabpanel">
        <div class="section-title">📸 スクショからIFD生成</div>
        <form id="imageForm">
          <div class="mb-3">
            <label class="form-label">GMOスクショをアップロード</label>
            <input type="file" class="form-control" id="imageInput" accept="image/*" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">送信して解析</button>
        </form>
        <div class="result-box" id="manualResult">結果がここに表示されます...</div>
      </div>

      <!-- AIスイングIFDタブ -->
      <div class="tab-pane fade" id="ai" role="tabpanel">
        <div class="section-title">🤖 AIスイングIFD（4銘柄自動解析）</div>
        <p class="text-muted" style="font-size:0.9rem;">
          JP225 / NAS100 / GER40 / XAUUSD を自動解析<br>
          TradingView Webhookの価格・方向・シグナルを反映
        </p>
        <button id="runAIBtn" class="btn btn-success w-100">AIスイング解析を実行</button>
        <div class="result-box" id="aiResult">解析結果を待機中...</div>
      </div>
    </div>

    <!-- TradingView状態表示 -->
    <div class="mt-4 p-3" style="background:#2a2a2a; border-radius:10px;">
      <h6 style="color:#4fc3f7;">📡 TradingView Webhook状態</h6>
      <div id="tvStatus" style="font-size:0.85rem; color:#bbb;">取得中...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = window.location.origin;

    // ヘルスチェック
    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        document.getElementById('healthStatus').textContent = '● オンライン';
        document.getElementById('healthStatus').classList.remove('offline');
        
        // TradingView状態表示
        let tvHtml = '<table style="width:100%; font-size:0.85rem;">';
        tvHtml += '<tr><th>銘柄</th><th>方向</th><th>シグナル</th><th>価格</th></tr>';
        const symbols = ['JP225', 'NAS100', 'GER40', 'XAUUSD'];
        symbols.forEach(sym => {
          const dir = data.tv_last_direction[sym] || '-';
          const sig = data.tv_last_signal[sym] || '-';
          const price = data.tv_last_price[sym] || '-';
          tvHtml += `<tr><td>${sym}</td><td>${dir}</td><td>${sig}</td><td>${price}</td></tr>`;
        });
        tvHtml += '</table>';
        tvHtml += `<p style="margin-top:10px; color:#888;">Webhook受信数: ${data.alerts}</p>`;
        document.getElementById('tvStatus').innerHTML = tvHtml;
      } catch (e) {
        document.getElementById('healthStatus').textContent = '● オフライン';
        document.getElementById('healthStatus').classList.add('offline');
        document.getElementById('tvStatus').textContent = 'サーバー未接続';
      }
    }

    // 手動IFD送信
    document.getElementById('imageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      const fileInput = document.getElementById('imageInput');
      formData.append('file', fileInput.files[0]);
      
      document.getElementById('manualResult').textContent = '解析中...';
      
      try {
        const res = await fetch(`${API_BASE}/analyze/image`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        document.getElementById('manualResult').textContent = 
          '✅ アップロード成功\n\n' + JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById('manualResult').textContent = 
          '❌ エラー: ' + e.message;
      }
    });

    // AIスイング実行
    document.getElementById('runAIBtn').addEventListener('click', async () => {
      document.getElementById('aiResult').textContent = 'AI解析中...';
      
      try {
        const res = await fetch(`${API_BASE}/analyze/swing_multi`, {
          method: 'POST'
        });
        const data = await res.json();
        
        let output = '📊 AIスイングIFD解析結果\n\n';
        output += data.markdown || JSON.stringify(data, null, 2);
        
        document.getElementById('aiResult').textContent = output;
      } catch (e) {
        document.getElementById('aiResult').textContent = 
          '❌ エラー: ' + e.message;
      }
    });

    // 初期化
    checkHealth();
    setInterval(checkHealth, 5000); // 5秒ごとに更新
  </script>
</body>
</html>
